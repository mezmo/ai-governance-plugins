[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mezmo-governance-openai-agents"
version = "0.1.0"
description = "OpenAI Agents SDK tool input guardrail that gates tool calls through Mezmo Governance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "openai-agents>=0.24",
]

[tool.setuptools]
packages = ["mezmo_governance_openai_agents"]

[tool.setuptools.package-data]
mezmo_governance_openai_agents = ["py.typed"]
